pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_x_forwarded_proto $external_proto { default $scheme; https https; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), display-capture=(), microphone=(self)" always;
        add_header Cache-Control no-store always;
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            add_header Cache-Control no-store always;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request is too large."},"requestId":"$request_id"}';
        }
        location /api/ {
            proxy_pass http://backend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_read_timeout 15s;
        }
        location = /health { proxy_pass http://backend:4000/health; }
        location = /healthz { access_log off; return 200 'ok'; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
