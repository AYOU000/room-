version: '3.8'

services:
  db:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=room_user
      - POSTGRES_PASSWORD=room_pass
      - POSTGRES_DB=room_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U room_user -d room_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
      target: production
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://room_user:room_pass@db:5432/room_db
      - JWT_SECRET=super_secret_development_key
    depends_on:
      db:
        condition: service_healthy

  web:
    build: 
      context: ./frontend
    ports:
      - '80:80'
    depends_on:
      - api
